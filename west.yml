# The west manifest of the workspace this repository is built in, after the
# Zephyr example application:
#
#   west init -m https://github.com/walidbadar/Renode_RP2350 --mr main my-workspace
#   cd my-workspace && west update
#
# Zephyr comes in with the two modules a build for the RP2350 needs. It is
# pinned to the head of the pull request that adds SMP for Cortex-M,
#
#   https://github.com/zephyrproject-rtos/zephyr/pull/124714
#
# on which the SMP support for the RP2350 in soc/ is built. Go back to a
# release once that is merged.
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: 832b25c7760b222323f4f11c944284083f66e46d
      import:
        name-allowlist:
          - cmsis_6
          - hal_rpi_pico
