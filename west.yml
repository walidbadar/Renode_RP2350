# The manifest of the west workspace this repository is built in:
#
#   west init -m https://github.com/walidbadar/Renode_RP2350 --mr main my-workspace
#   cd my-workspace && west update
#
# Zephyr is pinned to the branch rp2350_smp of walidbadar/zephyr, which is
# upstream Zephyr with the Cortex-M SMP commits of
# https://github.com/zephyrproject-rtos/zephyr/pull/124714 on top. Go back to
# a release once the pull request is merged.
manifest:
  remotes:
    - name: walidbadar
      url-base: https://github.com/walidbadar

  projects:
    - name: zephyr
      remote: walidbadar
      revision: c3cd7868d47c15d40faad30fef83023fe6d90951
      import:
        name-allowlist:
          - cmsis_6
          - hal_rpi_pico
