name: Test

on:
  push:
  pull_request:

env:
  RENODE_VERSION: "1.16.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # The repository is the manifest repository of a west workspace, which
      # is the directory above it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: rp2350_renode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the west workspace and the Zephyr SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: rp2350_renode
          toolchains: arm-zephyr-eabi

      # twister starts renode and renode-test from the PATH.
      - name: Install Renode
        run: |
          curl -sSL -o renode.tar.gz \
            "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz"
          mkdir -p "$HOME/renode"
          tar -xf renode.tar.gz -C "$HOME/renode" --strip-components=1
          echo "$HOME/renode" >> "$GITHUB_PATH"
          pip install -r "$HOME/renode/tests/requirements.txt"

      - name: Run the tests
        run: |
          west twister -p cortex_m33/rp2350a/m33_0 --inline-logs \
            -T rp2350_renode \
            -T zephyr/samples/hello_world \
            -T zephyr/samples/synchronization \
            -T zephyr/samples/philosophers

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: |
            twister-out/twister.json
            twister-out/twister.xml
            twister-out/**/handler.log
            twister-out/**/build.log
