-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="rp2350_renode">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#7a3fe0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- Pins of the two cores -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <path d="M56 62v16M80 62v16M104 62v16M152 62v16M176 62v16M200 62v16"/>
    <path d="M56 178v16M80 178v16M104 178v16M152 178v16M176 178v16M200 178v16"/>
  </g>
  <!-- Core 0 and core 1 -->
  <rect x="36" y="78" width="88" height="100" rx="16" fill="#ffffff"/>
  <rect x="132" y="78" width="88" height="100" rx="16" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Verdana, Arial, sans-serif" font-size="58" font-weight="700"
     text-anchor="middle" fill="#3a57e8">
    <text x="80" y="149">0</text>
    <text x="176" y="149">1</text>
  </g>
  <!-- The mailbox, one arrow each way -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 218h72M150 206l14 12-14 12"/>
    <path d="M164 38H92M106 26L92 38l14 12"/>
  </g>
</svg>
